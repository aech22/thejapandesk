name: Generate Article

# 記事を生成して main に commit したあと、自分でビルドとデプロイまで行う。
# GITHUB_TOKEN による push は他のワークフローを起動しない（GitHub のループ防止仕様）ため、
# on: push で待っている deploy.yml は bot のコミットでは発火しない。
# 同じリポジトリの refresh-fares.yml が先に同じ形を取っている。
# 下の Setup Node 以降は deploy.yml の写しなので、片方を変えたらもう片方も直すこと。

on:
  schedule:
    # UTC 02:00 = JST 11:00 の毎日1本。コドナビ（UTC 01:00）と1時間ずらして
    # サジェスト取得が同時刻に集中しないようにしている。
    # 実際の着火は GitHub 側の遅延で数時間ずれる。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# deploy.yml・refresh-fares.yml と同じグループにして gh-pages への同時デプロイを直列化する。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ゲートと補充の検査が壊れた状態で本番を動かさないよう、生成の前にテストを通す
      - name: Run tests
        run: |
          node scripts/test_gate.mjs
          node scripts/test_replenish.mjs

      # キューが残り少なければ、生成の前に需要データから補充する。
      # 生成より前に置くのは、尽きかけた日も同じ実行で生成まで到達させるため。
      - name: Replenish queue if low
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/replenish.mjs

      # キー未登録の間は「失敗」ではなく「スキップ」にする（スクリプト側が自分で判断する）。
      # 毎回赤くなると通知を無視する習慣がつき、本当の故障を見落とすため。
      # シークレットを登録した日から、何もしなくてもそのまま動き出す。
      - name: Generate one article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.mjs

      # 生成物のアフィリリンク検査。LLM は URL を書かない決まりなので、
      # ここで引っかかるのは人が書いた記事か、決まりが破られたときだけ。
      - name: Check affiliate links
        run: node scripts/check_affiliate_links.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content/articles scripts/queue.json scripts/topics.json; then
            echo "変更なし（キューが空か、ゲートで破棄された）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add content/articles scripts/queue.json scripts/topics.json
          git commit -m "content: generate article ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install & build (Astro)
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: ${{ steps.commit.outputs.sha }}"
